name: pl3-s1-diagnose (temporary, read-only)
# Temporary diagnosis only. A successful run does NOT mean Stage 1 acceptance.
on:
  workflow_dispatch:

permissions: {}

jobs:
  s1-diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout read-only source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect S1 HTTP and parser behavior (no page bodies or draw numbers)
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import urllib.error
          import urllib.request
          from urllib.parse import urlparse
          import sources

          with open("data/pl3_history.json", encoding="utf-8") as f:
              historical = {row["issue_no"]: row for row in json.load(f)}

          for issue in ("26296", "26300"):
              print("=== S1 DIAGNOSTIC", issue, "===")
              url = sources.S1_URL.format(period=issue)
              if urlparse(url).hostname != "kaijiang.500.com":
                  raise RuntimeError("Unexpected S1 host; aborting")
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": sources.UA,
                           "Accept-Language": "zh-CN,zh;q=0.9"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      code = response.status
                      final_host = urlparse(response.geturl()).hostname
                      raw = response.read(1_000_001)
                      charset = response.headers.get_content_charset()
              except urllib.error.HTTPError as exc:
                  print("http_status:", exc.code, "error_type: HTTPError")
                  continue
              except Exception as exc:
                  print("request_error_type:", type(exc).__name__)
                  continue

              print("http_status:", code)
              print("final_host:", final_host)
              print("redirected_to_other_host:", final_host != "kaijiang.500.com")
              print("response_bytes_capped:", len(raw))
              print("body_limit_exceeded:", len(raw) > 1_000_000)
              print("response_sha256:", hashlib.sha256(raw).hexdigest())
              print("declared_charset:", charset or "unspecified")
              try:
                  raw.decode("utf-8")
                  detected_decode = "utf-8"
              except UnicodeDecodeError:
                  detected_decode = "gb18030-fallback"
              print("decode_path:", detected_decode)
              if code != 200 or len(raw) > 1_000_000:
                  print("parse_not_attempted")
                  continue

              text = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", sources.decode(raw)))
              has_issue_marker = bool(re.search(r"第\s*(\d{5})\s*期", text))
              has_date_marker = bool(re.search(r"开奖日期[：:]\s*\d{4}年\s*\d{1,2}月\s*\d{1,2}日", text))
              has_numbers_marker = bool(re.search(r"开奖号码[：:]\s*\d\s*\d\s*\d(?!\d)", text))
              print("has_issue_marker:", has_issue_marker)
              print("has_date_marker:", has_date_marker)
              print("has_numbers_marker:", has_numbers_marker)
              print("has_closing_body:", bool(re.search(rb"</body\s*>", raw, re.I)))
              print("has_closing_html:", bool(re.search(rb"</html\s*>", raw, re.I)))
              parsed = sources.parse_500(issue, raw)
              print("parser_result:", "PARSED" if parsed else "NONE")
              ref = historical.get(issue)
              print("in_local_snapshot:", ref is not None)
              if parsed is not None and ref is not None:
                  print("matches_snapshot:", parsed["date"] == ref["date"] and parsed["numbers"] == [int(n) for n in ref["numbers"]])
          print("DIAGNOSTIC ONLY: Stage 1 remains FAIL pending S1 independent acceptance.")
          PY
      - name: Probe official Gansu lottery publication (read-only; no draw values logged)
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, html, json, re, urllib.error, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urlparse

          URLS = (
              "https://www.gstc.org.cn/wanfa/pl",
              "https://www.gstc.org.cn/wanfa/pl3_history",
          )
          with open("data/pl3_history.json", encoding="utf-8") as f:
              history = json.load(f)
          ref = {r["issue_no"]: r for r in history[-5:]}

          class TextOnly(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, d):
                  self.parts.append(d)

          for url in URLS:
              print("=== OFFICIAL GANSU CANDIDATE:", urlparse(url).path, "===")
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (compatible; pl3-lab/2.0; research)",
                  "Accept-Language": "zh-CN,zh;q=0.9",
              })
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      status = r.status
                      final_host = urlparse(r.geturl()).hostname
                      body = r.read(1_000_001)
              except urllib.error.HTTPError as e:
                  print("http_status:", e.code, "error_type: HTTPError")
                  continue
              except Exception as e:
                  print("request_error_type:", type(e).__name__)
                  continue
              print("http_status:", status)
              print("final_host:", final_host)
              print("bytes_capped:", len(body))
              print("too_large:", len(body) > 1_000_000)
              print("sha256:", hashlib.sha256(body).hexdigest())
              print("closing_html:", b"</html" in body.lower())
              if status != 200 or final_host != "www.gstc.org.cn" or len(body) > 1_000_000:
                  print("parse_skipped: host/status/size")
                  continue
              try:
                  src = body.decode("utf-8")
                  encoding = "utf-8"
              except UnicodeDecodeError:
                  src = body.decode("gb18030", errors="replace")
                  encoding = "gb18030-fallback"
              print("decode:", encoding)
              p = TextOnly()
              p.feed(src)
              clean = " ".join(html.unescape(" ".join(p.parts)).split())
              # Parse date, period, and three digits in the published history table.
              matches = re.findall(r"(20\d{2}-\d{2}-\d{2})\s+(\d{5})\s+(\d{3})(?!\d)", clean)
              got = {period: (dt, [int(x) for x in draw]) for dt, period, draw in matches}
              print("history_rows_detected:", len(got))
              print("matched_periods:", ",".join(sorted(got, reverse=True)[:3]) or "none")
              flags = {}
              for period, r in ref.items():
                  if period not in got:
                      flags[period] = "MISSING"
                  else:
                      date, nums = got[period]
                      flags[period] = "MATCH" if date == r["date"] and nums == [int(x) for x in r["numbers"]] else "MISMATCH"
              print("last5_snapshot_comparison:", flags)
              print("has_recent_draw_claim:", bool(re.search(r"2630[1-9]", clean)))
          print("CANDIDATE DIAGNOSTIC ONLY: no stage-1 acceptance implied.")
          PY
      - name: Inspect Gansu HTML text structure (sanitized; read-only)
        shell: bash
        run: |
          python3 - <<'PY'
          import collections, hashlib, re, urllib.error, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urlparse

          urls = ("https://www.gstc.org.cn/wanfa/pl",
                  "https://www.gstc.org.cn/wanfa/pl3_history")
          class Shape(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = collections.Counter()
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  self.tags[tag] += 1
              def handle_data(self, content):
                  self.text.append(content)
          for url in urls:
              print("=== GANSU DOM SHAPE", urlparse(url).path, "===")
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (compatible; pl3-lab/2.0; research)",
                  "Accept-Language": "zh-CN,zh;q=0.9"
              })
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      status = resp.status
                      host = urlparse(resp.geturl()).hostname
                      raw = resp.read(1_000_001)
              except Exception as e:
                  print("network_error:", type(e).__name__)
                  continue
              print("http_status:", status, "host:", host,
                    "bytes:", len(raw), "sha256:", hashlib.sha256(raw).hexdigest())
              if status != 200 or host != "www.gstc.org.cn" or len(raw) > 1_000_000:
                  print("parse_skipped")
                  continue
              try: html = raw.decode("utf-8")
              except UnicodeDecodeError: html = raw.decode("gb18030", errors="replace")
              doc = Shape()
              doc.feed(html)
              clean = " ".join(" ".join(doc.text).split())
              print("tag_counts:", {key: doc.tags[key] for key in
                    ("table", "thead", "tbody", "tr", "td", "li", "span", "script")})
              print("text_length:", len(clean))
              print("date_pattern_count:", len(re.findall(r"20\d{2}[-/]\d{1,2}[-/]\d{1,2}", clean)))
              for key in ("开奖日期", "开奖期次", "开奖公告",
                          "26296", "26300", "26302", "26303"):
                  i = clean.find(key)
                  print("marker:", key, "present:", i >= 0)
                  if i >= 0:
                      start, end = max(0, i - 50), min(len(clean), i + len(key) + 85)
                      part = re.sub(r"\d", "#", clean[start:end])
                      # Only a tiny digit-masked snippet; no page body or draw numbers.
                      print("masked_context:", part[:150])
          print("DOM SHAPE DIAGNOSTIC ONLY: Stage 1 remains FAIL.")
          PY
      - name: Validate Gansu history row layout against five frozen snapshot rows
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, hashlib, html, json, re, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urlparse

          URL = "https://www.gstc.org.cn/wanfa/pl3_history"
          class TextNodes(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.nodes = []
              def handle_data(self, data):
                  if data.strip():
                      self.nodes.append(data)

          with open("data/pl3_history.json", encoding="utf-8") as f:
              history = json.load(f)
          expected = {str(r["issue_no"]): r for r in history[-5:]}
          request = urllib.request.Request(URL, headers={
              "User-Agent": "Mozilla/5.0 (compatible; pl3-lab/2.0; research)",
              "Accept-Language": "zh-CN,zh;q=0.9",
          })
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  status = response.status
                  host = urlparse(response.geturl()).hostname
                  body = response.read(1_000_001)
          except Exception as exc:
              print("candidate_status: NETWORK_ERROR", type(exc).__name__)
              raise SystemExit(0)  # diagnostic only, never an acceptance gate

          print("candidate_http:", status)
          print("candidate_host:", host)
          print("candidate_bytes:", len(body))
          print("candidate_sha256:", hashlib.sha256(body).hexdigest())
          if status != 200 or host != "www.gstc.org.cn" or len(body) > 1_000_000:
              print("candidate_status: INVALID_RESPONSE")
              raise SystemExit(0)
          try:
              decoded = body.decode("utf-8")
          except UnicodeDecodeError:
              decoded = body.decode("gb18030", errors="replace")
          parser = TextNodes()
          parser.feed(decoded)
          text = " ".join(html.unescape(" ".join(parser.nodes)).split())
          start_marker = "开奖日期 开奖期次 开奖号码"
          pos = text.find(start_marker)
          if pos < 0:
              print("candidate_status: TABLE_HEADER_NOT_FOUND")
              raise SystemExit(0)
          segment = text[pos + len(start_marker):]
          for stop in ("当前第", "奖级对照", "友情链接"):
              at = segment.find(stop)
              if at >= 0:
                  segment = segment[:at]
          # Published HTML renders each of the three draw digits as a separate text node.
          pattern = re.compile(r"(?<!\d)(20\d{2}-\d{1,2}-\d{1,2})\s+(\d{5})\s+(\d)\s+(\d)\s+(\d)(?!\d)")
          found = {}
          duplicate = set()
          for match in pattern.finditer(segment):
              draw_date, period, *digits = match.groups()
              try:
                  datetime.date.fromisoformat(draw_date)
              except ValueError:
                  continue
              if period in found:
                  duplicate.add(period)
              found[period] = (draw_date, [int(n) for n in digits])
          print("table_header_found: True")
          print("matched_rows:", len(found))
          print("duplicate_period_count:", len(duplicate))
          print("latest_parsed_period:", max(found) if found else "none")
          for period, reference in sorted(expected.items()):
              if period in duplicate:
                  result = "DUPLICATE"
              elif period not in found:
                  result = "MISSING"
              else:
                  draw_date, digits = found[period]
                  result = "MATCH" if draw_date == reference["date"] and digits == [int(v) for v in reference["numbers"]] else "MISMATCH"
              print("snapshot_check:", period, result)
          print("CANDIDATE PARSER DIAGNOSTIC ONLY; no change to stage-1 acceptance.")
          PY
